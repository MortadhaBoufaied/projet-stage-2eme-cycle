[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#fafafa"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 200

[client]
# Hide Streamlit's default page list so only the custom grouped navigation is shown.
showSidebarNavigation = false
toolbarMode = "minimal"
